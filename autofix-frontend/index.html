<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AutoFix — Panel de gestión para talleres mecánicos: clientes, vehículos, citas, órdenes, inventario y facturación." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://TU-PANEL.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AutoFix" />
    <meta property="og:title" content="AutoFix — Panel del taller" />
    <meta property="og:description" content="Panel de gestión para talleres mecánicos: clientes, vehículos, citas, órdenes, inventario y facturación." />
    <script>
      // Aplica el tema guardado antes del primer pintado (evita el destello).
      (function () {
        try {
          var guardado = localStorage.getItem('autofix_tema');
          var tema = guardado === 'claro' || guardado === 'oscuro' ? guardado : 'oscuro';
          document.documentElement.dataset.tema = tema;
          document.documentElement.style.colorScheme = tema === 'claro' ? 'light' : 'dark';
        } catch (error) { /* sin localStorage: se usa el tema oscuro */ }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AutoFix — Panel del taller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  </body>
