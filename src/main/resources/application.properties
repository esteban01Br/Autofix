spring.application.name=autofix-backend

# ==========================
# CONFIGURACIÓN DE MYSQL
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/autofix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Esta línea incluso puedes eliminarla (Spring la detecta automáticamente)
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================
# SERVIDOR
# ==========================
server.port=8081